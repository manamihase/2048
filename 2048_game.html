<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
#app { padding: 1rem 0; display: flex; flex-direction: column; align-items: center; gap: 16px; }
#header { display: flex; align-items: center; gap: 20px; width: 100%; max-width: 420px; justify-content: space-between; }
#title { font-size: 28px; font-weight: 500; color: var(--color-text-primary); }
#scores { display: flex; gap: 10px; }
.score-box { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 6px 14px; text-align: center; min-width: 70px; }
.score-label { font-size: 11px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
.score-val { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
#board-wrap { background: #b5a390; border-radius: 8px; padding: 8px; }
#board { display: grid; grid-template-columns: repeat(4, 96px); grid-template-rows: repeat(4, 96px); gap: 8px; }
.cell { width: 96px; height: 96px; border-radius: 6px; background: rgba(238,228,218,0.35); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 500; transition: background 0.1s; position: relative; }
.tile { position: absolute; width: 96px; height: 96px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 500; animation: pop 0.12s ease-out; }
@keyframes pop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }
@keyframes merge { 0% { transform: scale(1); } 50% { transform: scale(1.18); } 100% { transform: scale(1); } }
.merge-anim { animation: merge 0.18s ease-in-out; }
#controls { display: flex; gap: 10px; }
button { padding: 8px 20px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: transparent; color: var(--color-text-primary); font-size: 14px; cursor: pointer; transition: background 0.1s; }
button:hover { background: var(--color-background-secondary); }
#msg { font-size: 16px; font-weight: 500; color: var(--color-text-secondary); min-height: 24px; }
#hint { font-size: 13px; color: var(--color-text-tertiary); }
</style>

<div id="app">
  <div id="header">
    <div id="title">2048</div>
    <div id="scores">
      <div class="score-box"><div class="score-label">スコア</div><div class="score-val" id="score">0</div></div>
      <div class="score-box"><div class="score-label">最高</div><div class="score-val" id="best">0</div></div>
    </div>
  </div>
  <div id="board-wrap"><div id="board"></div></div>
  <div id="msg"></div>
  <div id="controls">
    <button onclick="newGame()">新しいゲーム</button>
    <button onclick="undo()">元に戻す</button>
  </div>
  <div id="hint">矢印キー または スワイプで操作</div>
</div>

<script>
const COLORS = {
  2:    { bg: '#eee4da', color: '#776e65', fs: 36 },
  4:    { bg: '#ede0c8', color: '#776e65', fs: 36 },
  8:    { bg: '#f2b179', color: '#f9f6f2', fs: 36 },
  16:   { bg: '#f59563', color: '#f9f6f2', fs: 36 },
  32:   { bg: '#f67c5f', color: '#f9f6f2', fs: 36 },
  64:   { bg: '#f65e3b', color: '#f9f6f2', fs: 36 },
  128:  { bg: '#edcf72', color: '#f9f6f2', fs: 28 },
  256:  { bg: '#edcc61', color: '#f9f6f2', fs: 28 },
  512:  { bg: '#edc850', color: '#f9f6f2', fs: 28 },
  1024: { bg: '#edc53f', color: '#f9f6f2', fs: 22 },
  2048: { bg: '#edc22e', color: '#f9f6f2', fs: 22 },
};

let grid, score, best, history, won, over;
const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');

function newGame() {
  grid = Array.from({length:4}, ()=>Array(4).fill(0));
  score = 0; won = false; over = false;
  history = [];
  msgEl.textContent = '';
  addTile(); addTile();
  render();
}

function addTile() {
  const empty = [];
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(!grid[r][c]) empty.push([r,c]);
  if(!empty.length) return;
  const [r,c] = empty[Math.floor(Math.random()*empty.length)];
  grid[r][c] = Math.random()<0.9 ? 2 : 4;
  return [r,c];
}

function render(newPos) {
  boardEl.innerHTML = '';
  for(let r=0;r<4;r++) {
    for(let c=0;c<4;c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if(grid[r][c]) {
        const v = grid[r][c];
        const tile = document.createElement('div');
        tile.className = 'tile' + (newPos && newPos[0]===r && newPos[1]===c ? '' : '');
        const cfg = COLORS[v] || { bg: '#3c3a32', color: '#f9f6f2', fs: 18 };
        tile.style.cssText = `background:${cfg.bg};color:${cfg.color};font-size:${cfg.fs}px;width:96px;height:96px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:500;`;
        tile.textContent = v;
        cell.appendChild(tile);
      }
      boardEl.appendChild(cell);
    }
  }
  scoreEl.textContent = score;
  if(score > best) { best = score; bestEl.textContent = best; }
}

function slide(row) {
  let arr = row.filter(x=>x);
  let merged = false;
  let gained = 0;
  for(let i=0;i<arr.length-1;i++) {
    if(arr[i]===arr[i+1]) {
      arr[i] *= 2; gained += arr[i];
      arr.splice(i+1,1); merged = true;
      if(arr[i]===2048 && !won) { won=true; msgEl.textContent='🎉 2048達成！'; }
    }
  }
  while(arr.length<4) arr.push(0);
  return { arr, gained };
}

function move(dir) {
  if(over) return;
  const prev = JSON.stringify(grid);
  const prevScore = score;
  let gained = 0;

  if(dir==='left') {
    for(let r=0;r<4;r++) { let s=slide(grid[r]); grid[r]=s.arr; gained+=s.gained; }
  } else if(dir==='right') {
    for(let r=0;r<4;r++) { let s=slide([...grid[r]].reverse()); grid[r]=s.arr.reverse(); gained+=s.gained; }
  } else if(dir==='up') {
    for(let c=0;c<4;c++) {
      let col=[grid[0][c],grid[1][c],grid[2][c],grid[3][c]];
      let s=slide(col); for(let r=0;r<4;r++) grid[r][c]=s.arr[r]; gained+=s.gained;
    }
  } else if(dir==='down') {
    for(let c=0;c<4;c++) {
      let col=[grid[3][c],grid[2][c],grid[1][c],grid[0][c]];
      let s=slide(col); for(let r=3;r>=0;r--) grid[r][c]=s.arr[3-r]; gained+=s.gained;
    }
  }

  if(JSON.stringify(grid)===prev) return;
  history.push({ grid: JSON.parse(prev), score: prevScore });
  if(history.length>5) history.shift();
  score += gained;
  const pos = addTile();
  render(pos);
  if(isOver()) { over=true; msgEl.textContent='ゲームオーバー！新しいゲームを始めましょう。'; }
}

function isOver() {
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) {
    if(!grid[r][c]) return false;
    if(c<3 && grid[r][c]===grid[r][c+1]) return false;
    if(r<3 && grid[r][c]===grid[r+1][c]) return false;
  }
  return true;
}

function undo() {
  if(!history.length) return;
  const h = history.pop();
  grid = h.grid; score = h.score;
  over = false; won = false;
  msgEl.textContent = '';
  render();
}

document.addEventListener('keydown', e => {
  const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
  if(map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

let tx=0, ty=0;
document.getElementById('board-wrap').addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, {passive:true});
document.getElementById('board-wrap').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
}, {passive:true});

newGame();
</script>
